spring:
  application:
    name: mall-portal
  profiles:
    active: dev #默认为开发环境

mybatis-plus:
  mapper-locations:
    - classpath*:/mapper/**/*.xml
    - classpath*:dao/*.xml

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: mall-portal-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

secure:
  ignored:
    urls: #安全路径白名单（仅放行必须匿名的端点）
      # Swagger 文档资源
      - /swagger-ui/
      - /swagger-ui/**
      - /v3/api-docs/*
      - /webjars/**
      - /favicon.ico
      # 监控端点
      - /actuator/**
      - /druid/**
      # 会员认证匿名接口（/sso/info 需登录，不在此放行）
      - /sso/register
      - /sso/login
      - /sso/verifyQrCode
      - /sso/loginBySmsCode
      - /sso/forgetPassword
      - /sso/updatePassword
      - /sso/refreshToken
      # 图形验证码
      - /captcha/**
      # 门户浏览数据
      - /home/**
      - /product/**
      - /brand/**
      # 支付宝支付/异步回调（页面跳转与回调需匿名，浏览器无法带 token）
      - /alipay/**
      # 商品评论浏览（发表/回复/点赞需登录）
      - /comment/list
      - /comment/detail/**
      # 阿里云OSS上传成功回调（OSS服务器调用，无 token；policy 需登录）
      - /aliyun/oss/callback
      - /aliyun/oss/policy  #先开启

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller

# 自定义redis key
redis:
  database: mall
  key:
    smsCode: 'ums:smsCode'
    captcha: 'ums:captcha'
    orderId: 'oms:orderId'
    member: 'ums:member'
    # 商品SKU可用库存（预扣库存）缓存
    skuStock: 'pms:skuStock'
    # 商品SKU限购累计购买数缓存
    skuLimit: 'pms:skuLimit'
    # 防止重复下单的幂等锁key
    orderDedup: 'oms:dedup'
    # 防止短时间内重复添加购物车的防抖key
    cartDedup: 'oms:cartDedup'
    # 购物车列表缓存key
    cart: 'oms:cart'
  expire:
    smsCode: 300 # 短信验证码超期时间（秒）
    captcha: 60 # 图形验证码超期时间（秒）
    common: 86400 # 24小时
    skuStock: 86400 # SKU库存预扣缓存有效期（秒）
    skuLimit: 86400 # SKU限购累计有效期（秒）
    cart: 604800 # 购物车缓存有效期（秒），7天；到期后自动回源MySQL并回填

# ==================== 商品购买安全策略 ====================
# Redis 库存预扣 + Lua 防超卖 + RabbitMQ 异步扣库存 + 限购校验 + 订单/加购防抖
purchase:
  # 下单防重窗口（秒）：同一用户同一SKU在此窗口内只能成功提交一次订单
  order-dedup-seconds: 5
  # 加购防抖窗口（秒）：同一用户同一SKU在此窗口内的重复加购请求被拦截
  cart-dedup-seconds: 3
  # 限购：单个用户对单个SKU的最大购买数量（0 表示不限购）
  limit-per-user: 2

mongo:
  insert:
    sqlEnable: true # 用于控制是否通过数据库数据来插入mongo

# 消息队列定义
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue

