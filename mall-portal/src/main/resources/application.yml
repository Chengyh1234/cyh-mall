spring:
  application:
    name: mall-portal
  profiles:
    active: dev #默认为开发环境

mybatis-plus:
  mapper-locations:
    - classpath*:/mapper/**/*.xml
    - classpath*:dao/*.xml

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: mall-portal-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

secure:
  ignored:
    urls: #安全路径白名单（仅放行必须匿名的端点）
      # Swagger 文档资源
      - /swagger-ui/
      - /swagger-ui/**
      - /v3/api-docs/*
      - /webjars/**
      - /favicon.ico
      # 监控端点
      - /actuator/**
      - /druid/**
      # 会员认证匿名接口（/sso/info 需登录，不在此放行）
      - /sso/register
      - /sso/login
      - /sso/verifyQrCode
      - /sso/loginBySmsCode
      - /sso/forgetPassword
      - /sso/updatePassword
      - /sso/refreshToken
      # 图形验证码
      - /captcha/**
      # 门户浏览数据
      - /home/**
      - /product/**
      - /brand/**
      # 支付宝异步回调（支付宝服务器调用，无 token；pay/webPay/query 需登录）
      - /alipay/notify
      # 商品评论浏览（发表/回复/点赞需登录）
      - /comment/list
      - /comment/detail/**
      # 阿里云OSS上传成功回调（OSS服务器调用，无 token；policy 需登录）
      - /aliyun/oss/callback
      - /aliyun/oss/policy  #先开启

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller

# 自定义redis key
redis:
  database: mall
  key:
    smsCode: 'ums:smsCode'
    captcha: 'ums:captcha'
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    smsCode: 300 # 短信验证码超期时间（秒）
    captcha: 60 # 图形验证码超期时间（秒）
    common: 86400 # 24小时

mongo:
  insert:
    sqlEnable: true # 用于控制是否通过数据库数据来插入mongo

# 消息队列定义
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue

# ==================== 阿里云OSS对象存储配置 ====================
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com # oss对外服务的访问域名
    accessKeyId: YOUR_OSS_ACCESS_KEY_ID # 访问身份验证中用到用户标识
    accessKeySecret: YOUR_OSS_ACCESS_KEY_SECRET # 用户用于加密签名字符串和oss用来验证签名字符串的密钥
    bucketName: mall-oss-cyh # oss的存储空间
    policy:
      expire: 300 # 签名有效期(S)
    maxSize: 10 # 上传文件大小(M)
    callback: http://localhost:8085/aliyun/oss/callback # 文件上传成功后的回调地址
    dir:
      prefix: mall/images/ # 上传文件夹路径前缀